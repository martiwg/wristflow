name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS (app and core)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  # The core has to keep building without Apple frameworks: it is what a Windows version
  # is built on.
  linux-core:
    name: Linux (core)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  windows-core:
    name: Windows (core)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.1-release
          tag: 6.1-RELEASE
      - run: swift test
